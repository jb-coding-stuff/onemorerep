name: Supabase keep-alive

# Free Supabase projects pause after about a week without activity. This runs a
# tiny read query every day so the project stays active. Without a login the
# query returns no rows (Row Level Security), but it still hits the database.
on:
  schedule:
    - cron: '17 6 * * *' # daily, 06:17 UTC
  workflow_dispatch: # allows a manual run from the Actions tab

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: https://gjuaecwlxurksqlmoiic.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Add the repository secret SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          status=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/program_pack?select=pack_id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase answered HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Supabase did not answer normally (HTTP $status). The project may be paused: restore it in the Supabase dashboard."
            exit 1
          fi
